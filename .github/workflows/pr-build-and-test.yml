name: PR Build / Test

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements-ml.txt

      - name: Run API tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/api/ -v --cov=src/api --cov-report=term --cov-report=html

      - name: Run data layer unit tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/db/unit -v --cov=src/db --cov-report=term

      - name: Run ML tests
        # the ML code imports the database engine (database_loader.py), which needs a DATABASE_URL.
        # The tests never connect to it.
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/ml/ -v --cov=src/ml --cov-report=term

      - name: Build Docker image
        run: |
          docker build -t test-image:pr-${{ github.event.pull_request.number }} .

      - name: Create summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Python dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "Docker image built successfully" >> $GITHUB_STEP_SUMMARY
          echo "Ready to merge!" >> $GITHUB_STEP_SUMMARY
        if: always()

  db-integration-tests:
    # Data layer tests against a real PostGIS database with the migrations from astep-aau/Database,
    # the repo that owns the schema. The schema drift test fails if src/db/models no longer match.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout migrations (astep-aau/Database)
        uses: actions/checkout@v7
        with:
          repository: astep-aau/Database
          path: data-repo

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        # requirements-ml.txt (which includes requirements.txt), because tests/db/integration/test_save_run.py tests
        # saving the model runs, and the ML code needs torch
        run: |
          pip install --no-cache-dir -r requirements-ml.txt psycopg2-binary

      - name: Apply migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          python data-repo/migrations/apply_migrations.py

      - name: Run data layer and API integration tests
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/data"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/data"
        run: |
          pytest tests/db/integration tests/api -v --cov=src/db --cov=src/api --cov-report=term
