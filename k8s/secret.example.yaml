apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: cs-25-sw-5-06
type: Opaque
stringData:
  # The database runs as service `dataset-postgres` in namespace `main` (astep-aau/data repo).
  # Use the full cluster DNS name because the API runs in a different namespace.
  # TODO: Replace USERNAME and PASSWORD with the API's database user
  DATABASE_URL: "postgresql+asyncpg://USERNAME:PASSWORD@dataset-postgres.main.svc.cluster.local:5432/data"
